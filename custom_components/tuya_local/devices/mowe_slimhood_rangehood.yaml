name: Range hood
products:
  - id: f0mffstmrpa4hfws
    manufacturer: Mowe
    model: Wi-Fi Slim Hood 60cm
entities:
  - entity: fan
    dps:
      - id: 1
        type: boolean
        name: switch
      - id: 10
        type: string
        name: speed
        mapping:
          - dps_val: "off"
            value: 0
          - dps_val: low
            value: 33
          - dps_val: middle
            value: 67
          - dps_val: high
            value: 100
  - entity: light
    dps:
      - id: 4
        type: boolean
        name: switch
  - entity: number
    translation_key: timer
    class: duration
    category: config
    dps:
      - id: 13
        type: integer
        name: value
        unit: min
        range:
          min: 0
          max: 60
  - entity: sensor
    translation_key: status
    class: enum
    category: diagnostic
    dps:
      - id: 11
        type: string
        name: sensor
        optional: true
        mapping:
          - dps_val: standby
            value: standby
          - dps_val: working
            value: working
          - dps_val: "OFF"
            value: "off"
          - dps_val: delay
            value: working
  - entity: sensor
    name: Total runtime
    class: duration
    category: diagnostic
    dps:
      - id: 12
        type: integer
        name: sensor
        unit: h
        class: total_increasing
  - entity: sensor
    class: energy
    category: diagnostic
    dps:
      - id: 107
        type: integer
        name: sensor
        unit: Wh
        class: total_increasing
  - entity: binary_sensor
    class: problem
    category: diagnostic
    dps:
      - id: 15
        type: bitfield
        name: sensor
        optional: true
        mapping:
          - dps_val: 0
            value: false
          - dps_val: null
            value: false
          - value: true
      - id: 15
        type: bitfield
        name: fault_code
        optional: true
  - entity: binary_sensor
    name: Cleaning reminder
    icon: "mdi:spray-bottle"
    category: diagnostic
    dps:
      - id: 102
        type: boolean
        name: sensor
  - entity: binary_sensor
    name: Runtime reminder
    icon: "mdi:timer-alert"
    category: diagnostic
    dps:
      - id: 103
        type: boolean
        name: sensor
  - entity: binary_sensor
    name: Continuous running
    icon: "mdi:clock-alert"
    category: diagnostic
    dps:
      - id: 106
        type: string
        name: sensor
        mapping:
          - dps_val: "1"
            value: true
          - value: false
  - entity: button
    name: Reset data
    class: restart
    category: config
    hidden: true
    dps:
      - id: 104
        type: boolean
        name: button
        optional: true
  - entity: button
    name: Dismiss 1 hour reminder
    icon: "mdi:bell-cancel"
    category: config
    hidden: true
    dps:
      - id: 108
        type: boolean
        name: button
        optional: true
        mapping:
          - dps_val: false
            value: true
  - entity: button
    name: Reset 30 hour reminder
    icon: "mdi:bell-cancel"
    category: config
    hidden: true
    dps:
      - id: 109
        type: boolean
        name: button
        optional: true
